<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Project - Gestión de Donaciones</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Fondo con degradado Azul y Verde para el Login/Registro */
    body { 
      background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 70%, #00C9A7 100%);
      min-height: 100vh;
      margin: 0; 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center;
    }

    .container { 
      width: 100%; 
      max-width: 450px; 
      background: rgba(255, 255, 255, 0.95); 
      padding: 35px 30px; 
      border-radius: 12px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
      transition: all 0.3s ease;
    }

    /* Estilos adaptables cuando se abre el panel principal */
    .container.wide {
      max-width: 900px;
      background: #ffffff;
    }

    .hidden { display: none !important; }

    /* Cabecera del Login con Logotipo y Nombre */
    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 10px auto;
      display: block;
    }

    .brand-title {
      color: #102a43;
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      color: #627d98;
      font-size: 14px;
      margin-top: 5px;
    }

    h2 { color: #334e68; margin-top: 0; text-align: center; font-size: 20px; }
    h3 { color: #334e68; margin-top: 0; }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #486581; font-size: 14px; }
    
    input, select, button { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #bcccdc; 
      border-radius: 6px; 
      font-size: 14px; 
      outline: none;
    }

    input:focus, select:focus {
      border-color: #00C9A7;
      box-shadow: 0 0 0 3px rgba(0, 201, 167, 0.2);
    }

    /* Botón Principal con degradado Verde/Azul */
    button[type="submit"] { 
      background: linear-gradient(90deg, #00C9A7 0%, #0072ff 100%);
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: 600; 
      margin-top: 10px; 
      font-size: 15px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button[type="submit"]:hover { 
      opacity: 0.95; 
      transform: translateY(-1px);
    }

    .btn-danger { background: #e53e3e; color: white; border: none; padding: 6px 12px; width: auto; margin: 0; cursor: pointer; border-radius: 4px; font-weight: 600; }
    .btn-danger:hover { background: #c53030; }
    
    .btn-success { background: #00C9A7; color: white; border: none; padding: 6px 12px; width: auto; margin: 0; cursor: pointer; border-radius: 4px; font-weight: 600; }
    .btn-success:hover { background: #00b394; }
    
    .btn-secondary { background: #829ab1; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .btn-secondary:hover { background: #627d98; }
    
    .btn-logout { background: #e53e3e; color: white; border: none; width: auto; float: right; margin-top: 0; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: 600; }

    .alert { padding: 12px; margin-bottom: 20px; border-radius: 6px; display: none; font-size: 14px; text-align: center; }
    .alert-error { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
    .alert-success { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; vertical-align: middle; }
    th { background-color: #f7fafc; color: #4a5568; }

    .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; margin-bottom: 20px; }
    
    .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #627d98; }
    .toggle-text a { color: #0072ff; text-decoration: none; font-weight: 600; cursor: pointer; }
    .toggle-text a:hover { text-decoration: underline; }

    .role-badge { background: #e2e8f0; color: #2d3748; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 10px; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: 10px;
      width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <div id="alertBox" class="alert"></div>

    <!-- CABECERA PRINCIPAL CON LOGO Y NOMBRE -->
    <div class="brand-header" id="brandHeader">
      <!-- LOGOTIPO SVG (Red / Network) -->
      <svg class="brand-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="14" r="8" fill="#00C9A7"/>
        <circle cx="14" cy="46" r="8" fill="#0072ff"/>
        <circle cx="50" cy="46" r="8" fill="#0072ff"/>
        <line x1="32" y1="14" x2="14" y2="46" stroke="#00C9A7" stroke-width="4"/>
        <line x1="32" y1="14" x2="50" y2="46" stroke="#00C9A7" stroke-width="4"/>
        <line x1="14" y1="46" x2="50" y2="46" stroke="#0072ff" stroke-width="4"/>
        <circle cx="32" cy="30" r="4" fill="#ffffff" stroke="#0052D4" stroke-width="3"/>
      </svg>
      <h1 class="brand-title">NETWORK PROJECT</h1>
      <p class="brand-subtitle">Plataforma de Gestión de Donaciones</p>
    </div>

    <!-- VISTA 1: INICIO DE SESIÓN -->
    <div id="loginSection">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginUser">Usuario o Email</label>
          <input type="text" id="loginUser" required placeholder="Ingresa tu usuario">
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="Ingresa tu contraseña">
        </div>
        <button type="submit">Ingresar al Sistema</button>
      </form>
      <div class="toggle-text">
        ¿No tienes una cuenta? <a id="showRegister">Registrarse aquí</a>
      </div>
    </div>

    <!-- VISTA 2: REGISTRO -->
    <div id="registerSection" class="hidden">
      <h2>Crear Nueva Cuenta</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="regUser">Nombre de Usuario / Email</label>
          <input type="text" id="regUser" required placeholder="Crea un usuario o correo">
        </div>
        <div class="form-group">
          <label for="regPassword">Contraseña</label>
          <input type="password" id="regPassword" required placeholder="Crea una contraseña">
        </div>
        <div class="form-group">
          <label for="regRole">Rol de Usuario</label>
          <select id="regRole">
            <option value="DONANTE">Donante</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>
        <button type="submit">Registrarme</button>
      </form>
      <div class="toggle-text">
        ¿Ya tienes cuenta? <a id="showLogin">Volver a Iniciar Sesión</a>
      </div>
    </div>

    <!-- VISTA 3: PANEL DE CONTROL -->
    <div id="appSection" class="hidden">
      <div class="header-panel">
        <div>
          <h2 style="display:inline; text-align:left;">Panel de Control</h2>
          <span id="userRoleBadge" class="role-badge"></span>
        </div>
        <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
      </div>

      <!-- Formulario para Registrar Donación -->
      <div style="background: #f7fafc; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #edf2f7;">
        <h3 style="margin-bottom:15px;">Registrar Nueva Donación</h3>
        <form id="donationForm">
          <div class="form-group">
            <label for="concepto">Concepto / Bien</label>
            <input type="text" id="concepto" required placeholder="Ej. Cobijas térmicas, Alimentos">
          </div>
          <div class="form-group">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" min="1" required placeholder="Ej. 10">
          </div>
          <div class="form-group">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" placeholder="Ej. Ropa, Alimentos, Salud">
          </div>
          <button type="submit">Registrar Donación</button>
        </form>
      </div>

      <!-- Tabla de Inventario -->
      <h3>Inventario Disponible</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Concepto</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
      </table>
    </div>
  </div>

  <!-- VENTANA MODAL PARA SOLICITAR DONACIÓN -->
  <div id="requestModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h3 id="modalItemTitle">Solicitar Donación</h3>
      <p id="modalItemStock" style="color: #627d98; font-size: 14px; margin-bottom: 15px;"></p>
      
      <form id="requestForm">
        <input type="hidden" id="modalItemId">
        <div class="form-group">
          <label for="modalCantidad">¿Cuántas deseas solicitar?</label>
          <input type="number" id="modalCantidad" min="1" required placeholder="Ingresa la cantidad">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-success">Confirmar Solicitud</button>
          <button type="button" id="btnCancelModal" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';

    const mainContainer = document.getElementById('mainContainer');
    const brandHeader = document.getElementById('brandHeader');
    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');
    const appSection = document.getElementById('appSection');
    const alertBox = document.getElementById('alertBox');
    
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const donationForm = document.getElementById('donationForm');
    
    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');
    const btnLogout = document.getElementById('btnLogout');
    const inventoryTable = document.getElementById('inventoryTable');
    const userRoleBadge = document.getElementById('userRoleBadge');

    const requestModal = document.getElementById('requestModal');
    const requestForm = document.getElementById('requestForm');
    const modalItemTitle = document.getElementById('modalItemTitle');
    const modalItemStock = document.getElementById('modalItemStock');
    const modalItemId = document.getElementById('modalItemId');
    const modalCantidad = document.getElementById('modalCantidad');
    const btnCancelModal = document.getElementById('btnCancelModal');

    function getUserRole() {
      const token = localStorage.getItem('jwt_token');
      if (!token) return null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.role;
      } catch (e) {
        return null;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('jwt_token')) {
        mostrarPanelPrincipal();
      }
    });

    showRegister.addEventListener('click', () => {
      loginSection.classList.add('hidden');
      registerSection.classList.remove('hidden');
    });

    showLogin.addEventListener('click', () => {
      registerSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
    });

    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertBox.style.display = 'block';
      setTimeout(() => alertBox.style.display = 'none', 4000);
    }

    // Registro
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUser').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al registrar');

        showAlert('¡Cuenta creada con éxito!');
        registerForm.reset();
        registerSection.classList.add('hidden');
        loginSection.classList.remove('hidden');
      } catch (err) {
        showAlert(err.message, true);
      }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error en login');

        localStorage.setItem('jwt_token', data.token);
        loginForm.reset();
        mostrarPanelPrincipal();
      } catch (err) {
        showAlert(err.message, true);
      }
    });

    btnLogout.addEventListener('click', () => {
      localStorage.removeItem('jwt_token');
      appSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
      brandHeader.classList.remove('hidden');
      mainContainer.classList.remove('wide');
    });

    function mostrarPanelPrincipal() {
      loginSection.classList.add('hidden');
      registerSection.classList.add('hidden');
      brandHeader.classList.add('hidden');
      mainContainer.classList.add('wide');
      appSection.classList.remove('hidden');
      
      const role = getUserRole();
      userRoleBadge.textContent = `Rol: ${role || 'Desconocido'}`;
      cargarInventario();
    }

    // Cargar Inventario
    async function cargarInventario() {
      const token = localStorage.getItem('jwt_token');
      const role = getUserRole();

      try {
        const res = await fetch(`${API_URL}/inventario`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al cargar inventario');

        inventoryTable.innerHTML = '';
        if (data.inventario && data.inventario.length > 0) {
          data.inventario.forEach(item => {
            let accionBtn = '';

            if (role === 'ADMIN') {
              accionBtn = `<button class="btn-danger" onclick="eliminarItem(${item.id})">Eliminar</button>`;
            } else {
              accionBtn = `<button class="btn-success" onclick="abrirModalSolicitud(${item.id}, '${item.concepto}', ${item.stock})">Solicitar</button>`;
            }

            inventoryTable.innerHTML += `
              <tr>
                <td>${item.id}</td>
                <td>${item.concepto}</td>
                <td>${item.categoria}</td>
                <td><strong>${item.stock}</strong></td>
                <td>${accionBtn}</td>
              </tr>
            `;
          });
        } else {
          inventoryTable.innerHTML = `<tr><td colspan="5" style="text-align:center;">No hay elementos en el inventario</td></tr>`;
        }
      } catch (err) {
        showAlert(err.message, true);
      }
    }

    function abrirModalSolicitud(id, concepto, stock) {
      modalItemId.value = id;
      modalItemTitle.textContent = `Solicitar: ${concepto}`;
      modalItemStock.textContent = `Stock disponible: ${stock} unidades`;
      modalCantidad.value = '';
      modalCantidad.max = stock;
      requestModal.classList.remove('hidden');
    }

    btnCancelModal.addEventListener('click', () => {
      requestModal.classList.add('hidden');
    });

    requestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = modalItemId.value;
      const cantidad = modalCantidad.value;
      const token = localStorage.getItem('jwt_token');

      try {
        const res = await fetch(`${API_URL}/solicitudes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ inventarioId: id, cantidadSolicitada: cantidad })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al procesar la solicitud');

        showAlert('¡Solicitud aceptada! Los insumos han sido descontados del inventario.');
        requestModal.classList.add('hidden');
        cargarInventario();
      } catch (err) {
        showAlert(err.message, true);
      }
    });

    async function eliminarItem(id) {
      if (!confirm('¿Seguro que deseas eliminar este elemento del inventario?')) return;
      const token = localStorage.getItem('jwt_token');

      try {
        const res = await fetch(`${API_URL}/inventario/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al eliminar');

        showAlert('Elemento eliminado del inventario');
        cargarInventario();
      } catch (err) {
        showAlert(err.message, true);
      }
    }

    donationForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = localStorage.getItem('jwt_token');
      const concepto = document.getElementById('concepto').value;
      const cantidad = document.getElementById('cantidad').value;
      const categoria = document.getElementById('categoria').value;

      try {
        const res = await fetch(`${API_URL}/donaciones`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ concepto, cantidad, categoria })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al registrar donación');

        showAlert('¡Donación registrada e inventario actualizado!');
        donationForm.reset();
        cargarInventario();
      } catch (err) {
        showAlert(err.message, true);
      }
    });
  </script>
</body>
</html>
